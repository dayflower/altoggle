[package]
name = "altoggle-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "altoggle"
path = "src/main.rs"

[dependencies]
altoggle-core = { version = "0.1.0", path = "../core" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Input_Ime", "Win32_UI_Accessibility", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_HiDpi"] }

[build-dependencies]
embed-manifest = "1.5.0"
embed-resource = "3.0.11"
