# Publishes a release when the version on main changes.
#
# The entry point is deliberately a push to main and not a pushed tag. The
# version has two homes in the tree -- Cargo.toml and crates\app\app.rc -- and a
# tag typed by hand would be a third one that nothing checks. Here the tag is
# derived from Cargo.toml at the commit being released, so a tag that disagrees
# with the binary is not a thing that can happen. scripts\bump.ps1 is the other
# half: it writes both files and opens the pull request, and merging that pull
# request is what reaches this workflow.
#
# `gh release create --target <sha>` creates the tag as part of creating the
# release, which is why no step pushes one. That costs a lightweight tag rather
# than an annotated one, and buys back the failure mode where a tag exists with
# no release behind it. It also sidesteps the rule that a tag pushed with
# GITHUB_TOKEN does not start another workflow: there is no other workflow to
# start, because this one goes all the way to the published release.
#
# Packaging is scripts\release.ps1, unchanged and unduplicated. That script is
# where "only altoggle.exe ships" is written down -- `cargo build --release`
# also produces keylog, altprobe and imeprobe, and shipping a keylogger next to
# a tray app would be an antivirus incident and a trust problem in one. A second
# copy of that allowlist here is exactly the thing that would rot.
#
# The winget manifest is updated from here rather than from a workflow of its
# own, and that is forced rather than chosen: the release below is created with
# GITHUB_TOKEN, and a release created with GITHUB_TOKEN does not start another
# workflow. `on: release` would sit there and never fire. The Scoop bucket runs
# the other way round -- its Excavator polls this repository's releases and
# rewrites its own manifest -- and the last job here only nudges it into doing
# that now rather than within four hours.
#
# What this does not do, each a decision rather than an oversight: code signing
# (there is no certificate, so SmartScreen still warns), an installer, arm64,
# and pre-release versions (app.rc's FILEVERSION cannot express one).

name: Release

on:
  push:
    branches: [main]
    # A cheap first filter only. The version might not have changed even when
    # this file did, so the guard below is what actually decides.
    paths: ['Cargo.toml']

# The tag and the release are both created here.
permissions:
  contents: write

# Never cancel a run that may already have published something.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: windows-latest

    # For the winget job below, which cannot see another job's step outputs.
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}

    steps:
      # Two commits, because the guard compares this Cargo.toml with the one
      # before it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Two conditions, and both have to hold. "The version changed" is what
      # makes an ordinary dependency bump in Cargo.toml a no-op; HEAD^ is the
      # first parent, so it reads as the previous state of main whether the
      # merge was a merge commit or a squash. "No release exists yet" is what
      # makes a re-run harmless.
      - name: decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pattern = '^version = "(.+)"'
          $version = (Select-String -Path Cargo.toml -Pattern $pattern |
              Select-Object -First 1).Matches[0].Groups[1].Value
          $before = (& git show 'HEAD^:Cargo.toml' | Select-String -Pattern $pattern |
              Select-Object -First 1).Matches[0].Groups[1].Value

          "tag=v$version" >> $env:GITHUB_OUTPUT
          # winget wants the version without the v; the tag wants it with one.
          "version=$version" >> $env:GITHUB_OUTPUT

          if ($version -eq $before) {
              Write-Host "Cargo.toml changed but the version did not ($version); nothing to release."
              "release=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          & gh release view "v$version" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "v$version is already released; nothing to do."
              "release=false" >> $env:GITHUB_OUTPUT
              exit 0
          }

          Write-Host "Releasing $before -> $version as v$version."
          "release=true" >> $env:GITHUB_OUTPUT

          # The gh probe above left a non-zero $LASTEXITCODE behind, and the
          # runner exits the step with whatever it holds at the end.
          exit 0

      # stable and unpinned, as in ci.yml: this is the compiler people actually
      # have. No components, because fmt and clippy ran on the pull request.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.decide.outputs.release == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.decide.outputs.release == 'true'

      # Not a repeat of the pull request's run: what gets built here is the
      # merge commit, and this is the last gate before something is published
      # under a version number. It also covers the drift test that ties app.rc
      # to Cargo.toml, which is the claim this whole workflow rests on.
      - name: cargo test
        if: steps.decide.outputs.release == 'true'
        run: cargo test

      # Builds --bin altoggle alone and leaves two assets in dist\: the zip of
      # altoggle.exe, README.md and LICENSE, and altoggle.exe on its own for the
      # winget portable manifest. The script's "altoggle is running" guard
      # cannot fire on a runner.
      - name: package
        if: steps.decide.outputs.release == 'true'
        run: .\scripts\release.ps1

      # The script prints the same hashes, but its stdout is a human's report
      # and not an interface. Read the files instead.
      - name: hash the assets
        id: assets
        if: steps.decide.outputs.release == 'true'
        run: |
          $zip = Get-ChildItem dist\*.zip
          if (@($zip).Count -ne 1) {
              throw "expected exactly one archive in dist\, found $(@($zip).Count)"
          }
          $exe = Join-Path (Get-Location) 'dist\altoggle.exe'
          if (-not (Test-Path $exe)) {
              throw "release.ps1 left no $exe for the winget manifest to point at"
          }
          "zip-path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip-name=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "zip-sha256=$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
          "exe-path=$exe" >> $env:GITHUB_OUTPUT
          "exe-sha256=$((Get-FileHash $exe -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT

      # --generate-notes writes the commit and pull request list; --notes-file
      # puts this in front of it. Both SHA256s are here because README.md
      # promises they are published with each release, and the unblock line
      # because a zip downloaded from the internet stays marked until someone
      # ticks the box -- which is the one thing the package managers spare you.
      - name: publish
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          ZIP_PATH: ${{ steps.assets.outputs.zip-path }}
          ZIP_NAME: ${{ steps.assets.outputs.zip-name }}
          ZIP_SHA256: ${{ steps.assets.outputs.zip-sha256 }}
          EXE_PATH: ${{ steps.assets.outputs.exe-path }}
          EXE_SHA256: ${{ steps.assets.outputs.exe-sha256 }}
        run: |
          $notes = @"
          ``````
          winget install dayflower.altoggle
          ``````
          ``````
          scoop bucket add dayflower https://github.com/dayflower/scoop-bucket
          scoop install dayflower/altoggle
          ``````

          Or take ``$($env:ZIP_NAME)`` below and **unblock it before extracting**
          -- right-click -> Properties -> tick Unblock -> OK. Windows marks
          anything downloaded from the internet, and left marked the executable
          is treated as untrusted. ``altoggle.exe`` beside it is the same binary
          without the wrapper, and is what the winget manifest points at.

          ``````
          SHA256  $($env:ZIP_SHA256)  $($env:ZIP_NAME)
          SHA256  $($env:EXE_SHA256)  altoggle.exe
          ``````

          altoggle is not code-signed, so SmartScreen warns on first launch.
          See the README for what the app does and does not do.
          "@
          $notes | Out-File notes.md -Encoding utf8

          gh release create "$env:TAG" "$env:ZIP_PATH" "$env:EXE_PATH" `
            --target "$env:GITHUB_SHA" `
            --title "$env:TAG" `
            --generate-notes `
            --notes-file notes.md

  # Opens the pull request against microsoft/winget-pkgs that updates
  # dayflower.altoggle to the version just published. Three things it needs, and
  # all three are set up by hand once:
  #
  #   - a fork of microsoft/winget-pkgs under dayflower; the action pushes its
  #     branch there and cannot work any other way
  #   - WINGET_TOKEN, a *classic* PAT with the public_repo scope. Fine-grained
  #     tokens are not supported by the action
  #   - one version of dayflower.altoggle already in winget-pkgs. The action
  #     updates an existing package; the first manifest is submitted by hand
  #     with komac or wingetcreate
  #
  # Set WINGET_TOKEN only after that first manifest is merged. Until it exists
  # the step below is skipped rather than failed, which is what the env guard
  # buys: `if:` at job level cannot read secrets, only env can.
  #
  # A failure here does not undo anything -- the release is already published,
  # and the same pull request can be opened from a laptop with `komac update`.
  winget:
    name: submit to winget-pkgs
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      # The zip is in the same release, so the regex has to name the exe rather
      # than take the action's default.
      - name: open the manifest pull request
        if: env.TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: dayflower.altoggle
          version: ${{ needs.release.outputs.version }}
          release-tag: ${{ needs.release.outputs.tag }}
          installers-regex: '^altoggle\.exe$'
          token: ${{ env.TOKEN }}

  # Nudges the bucket's Excavator, which otherwise finds the release on its next
  # four-hourly poll. Nothing had to be added on the bucket's side: its
  # excavator.yml already carries `workflow_dispatch:`.
  #
  # The polling stays the thing that guarantees the update, and this job is
  # deliberately built so that it cannot cost anything when it fails. It is
  # last, nothing depends on it, and the release is already published by the
  # time it runs -- so an expired key or an uninstalled App delays the manifest
  # by at most one poll rather than losing it.
  #
  # GITHUB_TOKEN cannot reach another repository, so the token is minted from
  # the GitHub App: `owner` and `repositories` scope it to scoop-bucket alone,
  # and the App must be installed there with Actions: read and write. Two
  # settings back it, both named as in the other repositories that use the App
  # -- the ACTIONS_APP_ID variable and the ACTIONS_APP_PRIVATE_KEY secret.
  # Without them the steps are skipped rather than failed, as with WINGET_TOKEN
  # above; `vars` is readable from `if:` where `secrets` is not, which is why
  # the variable is what the guard tests.
  scoop:
    name: kick the Scoop bucket
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Nothing here uses GITHUB_TOKEN; the App token is the only credential.
    permissions: {}
    env:
      APP_ID: ${{ vars.ACTIONS_APP_ID }}

    steps:
      - name: mint a token for the bucket
        id: token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scoop-bucket

      # No --ref: gh runs the workflow from the bucket's default branch, so the
      # branch name is not written down a second time here to disagree with it.
      - name: dispatch the Excavator
        if: steps.token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run excavator.yml -R ${{ github.repository_owner }}/scoop-bucket
